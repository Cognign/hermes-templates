<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Static App</title>
  <link rel="stylesheet" href="theme.css">
  <script src="hermes-live-theme.js" data-dark="media" defer></script>
  <style>
    /* Colours, fonts, radius, shadow and spacing come from theme.css. */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--font-sans);
      letter-spacing: var(--tracking-normal);
      background-color: var(--background);
      color: var(--foreground);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: calc(var(--spacing) * 4);
    }
    main {
      background-color: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.4);
      padding: calc(var(--spacing) * 10);
      max-width: 32rem;
      width: 100%;
      box-shadow: var(--shadow-offset-x) var(--shadow-offset-y) var(--shadow-blur) var(--shadow-spread)
        rgb(from var(--shadow-color) r g b / var(--shadow-opacity));
      text-align: center;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: calc(var(--spacing) * 4);
      color: var(--primary);
    }
    p {
      color: var(--muted-foreground);
      line-height: 1.6;
      margin-bottom: calc(var(--spacing) * 6);
    }
    .badge {
      display: inline-block;
      padding: calc(var(--spacing) * 1) calc(var(--spacing) * 3);
      background-color: var(--secondary);
      color: var(--secondary-foreground);
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main>
    <h1>Static Site Template</h1>
    <p>
      This static application is served from an independent origin. It contains no server-side secrets or credentials.
    </p>
    <span class="badge">Hermes Static App</span>
  </main>
</body>
</html>
